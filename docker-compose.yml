# Postgres is the only infrastructure SimPress needs (ADR-0008).
services:
  postgres:
    image: postgres:16-alpine
    container_name: simpress-postgres
    environment:
      POSTGRES_USER: simpress
      POSTGRES_PASSWORD: simpress
      POSTGRES_DB: simpress
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simpress']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
