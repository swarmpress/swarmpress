<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>swarm.press</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; color: #e8e6e3; font: 14px system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      .hud { position: absolute; top: 12px; left: 12px; display: flex; gap: 12px; align-items: baseline;
             padding: 6px 12px; border-radius: 8px; background: rgba(15, 18, 26, 0.72); backdrop-filter: blur(6px); }
      .hud-clock { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
      .hud-meta { opacity: 0.7; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <!-- CEO management overlay (src/ui/mount.tsx); styles in src/ui/overlay.css -->
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
