# Cockpit test map (cockpit.toml → [test_map]).
#
# Precedence: an explicit tag in the test itself wins, then this map, then `paths:` ownership in
# docs/features. Use this file only for tests that paths cannot attribute precisely, mainly
# Rust unit tests in a crate's `src/lib.rs`: nextest reports them with the source path
# `crates/<crate>/src`, which every feature of that crate would otherwise own.
#
# Keys under `match` are ANDed. `classname` is the Cargo package; `title` is a substring of the
# test name (`tests::clock_wraps_at_midnight`). Move tests into modules (`src/clock.rs`) and
# drop the entry once paths can do the job.

- match: { classname: sim-core, title: "tests::clock_" }
  features: [FEAT-002]
- match: { classname: sim-core, title: "_hash" }
  features: [FEAT-001]
- match: { classname: sim-core, title: "plan::tests" }
  features: [FEAT-006]
# Ticket rules: kinds, options, defaults, deadlines (the publish gate and the failure tickets too).
- match: { classname: sim-core, title: "inbox::tests" }
  features: [FEAT-009, FEAT-079]
- match: { classname: protocol }
  features: [FEAT-011]
# The page-type registry (FEAT-089): the exported format, the body checks, the pipeline's cross-check.
# The blueprint crate's unit tests: types and the town (FEAT-090), the importer (FEAT-093).
- match: { classname: blueprint, title: "types::tests" }
  features: [FEAT-090]
- match: { classname: blueprint, title: "import::tests" }
  features: [FEAT-093]
# Theme components (FEAT-094): the component check and tokens, the Web Developer's prompt and schema.
- match: { classname: blueprint, title: "theme::tests" }
  features: [FEAT-094]
- match: { classname: agents, title: "theme::tests" }
  features: [FEAT-094]
# Agents calling the site's tools through use_tools (FEAT-091).
- match: { classname: agents, title: "tool_use::tests" }
  features: [FEAT-091]
- match: { classname: content-schema, title: "the_core_page_types" }
  features: [FEAT-089]
- match: { classname: content-model, title: "page_types::tests" }
  features: [FEAT-089]
- match: { classname: content-model, title: "the_constants_name_the_registry_s_article" }
  features: [FEAT-089]
- match: { classname: agents, title: "the_article_blocks_are_the_registry_s" }
  features: [FEAT-089]
- match: { classname: content-schema }
  features: [FEAT-042]
# The shared golden fixture (packages/runner/test/fixtures/golden.json): native = wasm = Bun.
- match: { classname: client-wasm, title: "runner_golden_hashes_match" }
  features: [FEAT-001, FEAT-055]
# The publish gate and the failure commands through the JSON boundary (ADR-0059).
- match: { classname: client-wasm, title: "failure_commands_and_their_tickets" }
  features: [FEAT-079, FEAT-009]
- match: { classname: client-wasm, title: "job_contract_through_json" }
  features: [FEAT-079, FEAT-006]
- match: { classname: client-wasm, title: "publish_gate" }
  features: [FEAT-079, FEAT-060]
- match: { classname: client-wasm, title: "bubbles_and_work_items" }
  features: [FEAT-079, FEAT-023]
# The site's model digests (BlueprintChanged, ToolsChanged) through the JSON door (FEAT-095).
- match: { classname: client-wasm, title: "model_digests_are_server_commands" }
  features: [FEAT-095]
# World snapshots through the facade (crates/client-wasm/tests/snapshot_wasm.rs).
- match: { classname: client-wasm, title: "snapshot" }
  features: [FEAT-060, FEAT-001]
- match: { classname: client-wasm }
  features: [FEAT-001, FEAT-023]
# agents unit tests in src/ (persona year ranges, the "never invent numbers" scanner).
- match: { classname: agents, title: "personas::tests::" }
  features: [FEAT-031]
- match: { classname: agents, title: "jobs::numbers::tests::" }
