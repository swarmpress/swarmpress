# Placement validation in sim-core's src/validate.rs (FEAT-003): lot, rooms, doors, windows,
# unlock levels and equipment. validate.rs is FEAT-079's path, so these keep FEAT-079 too.
- match: { classname: sim-core, title: "validate::tests::grown_lot_strips" }
