name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.100

jobs:
  rust:
    name: Rust (fmt, clippy, nextest)
    runs-on: ubuntu-latest
    # The server tests use temp-file / in-memory SQLite (ADR-0039): no services.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml

  wasm:
    name: wasm (build, wasm-bindgen-test, size budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo xtask wasm --release
      - name: wasm-bindgen-test (node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p client-wasm --target wasm32-unknown-unknown
      - name: wasm size budget (gzip <= 400 KiB)
        run: |
          size=$(gzip -9 -c crates/client-wasm/pkg/client_wasm_bg.wasm | wc -c)
          echo "client_wasm_bg.wasm gzip: $size bytes"
          mkdir -p artifacts/bench
          cat > artifacts/bench/bundle-size-wasm.json <<JSON
          { "schema": "cockpit.benchmark.v1", "name": "wasm-size", "component": "client-wasm",
            "provenance": { "commit": "${{ github.sha }}", "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)" },
            "metrics": [ { "name": "client_wasm_bg.wasm gzip", "unit": "bytes", "value": $size,
                           "determinism": "deterministic", "direction": "lower_is_better", "budget": { "max": 409600 } } ] }
          JSON
          test "$size" -le 409600
      # The orchestrator bridge is its own lazily loaded module with its own budget:
      # measured 1,055,980 bytes gzip on 2026-10-02, budget = measured + 20%.
      - name: orchestrator-wasm size budget (gzip <= 1,267,200 bytes)
        run: |
          size=$(gzip -9 -c crates/orchestrator-wasm/pkg/orchestrator_wasm_bg.wasm | wc -c)
          echo "orchestrator_wasm_bg.wasm gzip: $size bytes"
          mkdir -p artifacts/bench
          cat > artifacts/bench/bundle-size-orchestrator-wasm.json <<JSON
          { "schema": "cockpit.benchmark.v1", "name": "orchestrator-wasm-size", "component": "agents",
            "provenance": { "commit": "${{ github.sha }}", "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)" },
            "metrics": [ { "name": "orchestrator_wasm_bg.wasm gzip", "unit": "bytes", "value": $size,
                           "determinism": "deterministic", "direction": "lower_is_better", "budget": { "max": 1267200 } } ] }
          JSON
          test "$size" -le 1267200
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: orchestrator-wasm through the JS bridge (bun test)
        run: |
          mkdir -p crates/orchestrator-wasm/reports
          bun test crates/orchestrator-wasm/tests --reporter=junit --reporter-outfile=crates/orchestrator-wasm/reports/junit.xml; s=$?
          bun packages/sdk/scripts/bun-junit.ts crates/orchestrator-wasm/reports/junit.xml
          exit $s
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/client-wasm/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrator-wasm-pkg
          path: crates/orchestrator-wasm/pkg
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: orchestrator-wasm-junit
          path: crates/orchestrator-wasm/reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-bundle-size
          path: artifacts/bench

  web:
    name: Web (schema, typecheck, vitest, build, Playwright)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/client-wasm/pkg
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-wasm-pkg
          path: crates/orchestrator-wasm/pkg
      - run: pnpm schema:check
      - name: Tracker script (tests, size budget, embedded copy in sync)
        run: |
          pnpm --filter tracker test
          pnpm --filter tracker build
          pnpm --filter tracker check-drift
      - run: pnpm --filter @swarm-press/content-schema test
      - run: pnpm --filter @swarm-press/game typecheck
      - run: pnpm --filter @swarm-press/game exec vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - name: Build client (wasm prebuilt)
        run: pnpm --filter @swarm-press/game exec vite build
      - run: pnpm --filter @swarm-press/game exec playwright install --with-deps chromium
      - name: Playwright e2e (WebGPU + WebGL2)
        run: pnpm --filter @swarm-press/game exec playwright test e2e/smoke.spec.ts
        env:
          CI: '1'
          PW_JSON: reports/playwright.json
      - name: Playwright visual regression
        if: ${{ !cancelled() }}
        run: pnpm --filter @swarm-press/game exec playwright test e2e/visual.spec.ts
        env:
          CI: '1'
          PW_JSON: reports/playwright-visual.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: game-vitest-junit
          path: apps/game/reports/vitest-junit.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: game-playwright
          path: apps/game/reports/playwright.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: game-playwright-visual
          path: |
            apps/game/reports/playwright-visual.json
            apps/game/test-results

  browser-runtime:
    name: Browser runtime e2e (store engines, central server, orchestrator-wasm)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/client-wasm/pkg
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-wasm-pkg
          path: crates/orchestrator-wasm/pkg
      - run: pnpm --filter @swarm-press/game exec playwright install --with-deps chromium
      - name: Playwright orchestrator e2e (turso + sqlite; builds swarmpress-server)
        run: pnpm --filter @swarm-press/game exec playwright test -c playwright.orchestrator.config.ts
        env:
          CI: '1'
          PW_JSON: reports/playwright-orchestrator.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: game-playwright-orchestrator
          path: apps/game/reports/playwright-orchestrator.json
      # The MVP acceptance test (docs/mvp.md): the real game page (?central=1, production
      # build) against swarmpress-server, on both store engines.
      - name: Playwright MVP e2e (one article, end to end; turso + sqlite)
        if: ${{ !cancelled() }}
        run: pnpm --filter @swarm-press/game exec playwright test -c playwright.mvp.config.ts
        env:
          CI: '1'
          PW_JSON: reports/playwright-mvp.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: game-playwright-mvp
          path: apps/game/reports/playwright-mvp.json

  sdk:
    name: Extension SDK (sdk, sandbox, swarmpress runner, browser parity)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/client-wasm/pkg
      - run: pnpm -r --filter @swarm-press/sdk --filter @swarm-press/sandbox --filter @swarm-press/runner typecheck
      - name: SDK JSON Schemas in sync with zod
        run: pnpm --filter @swarm-press/sdk check
      - name: bun test (sdk, sandbox, runner; JUnit per package)
        run: pnpm test:sdk
      - name: Examples via the runner (Bun)
        run: |
          for ex in examples/extensions/*/; do
            bun packages/runner/src/cli.ts check "$ex"
            bun packages/runner/src/cli.ts test "$ex"
          done
          bun packages/runner/src/cli.ts run --seed 42 --days 3 $(for ex in examples/extensions/*/; do echo --ext "$ex"; done)
      - name: Runner under Node (content pack, no bundling)
        run: node packages/runner/src/cli.ts test examples/extensions/harvest-season
      - run: pnpm --filter @swarm-press/sandbox exec playwright install --with-deps chromium
      - name: Sandbox browser parity (Chromium)
        run: pnpm --filter @swarm-press/sandbox test:e2e
        env:
          CI: '1'
          PW_JSON: reports/playwright.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sdk-junit
          path: packages/sdk/reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sandbox-junit
          path: packages/sandbox/reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sandbox-playwright
          path: packages/sandbox/reports/playwright.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: runner-junit
          path: packages/runner/reports/junit.xml

  site-kit:
    name: Site kit + starter theme (kit check, astro build, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swarm-press/site-kit typecheck
      - name: Manifest JSON Schema in sync with zod
        run: pnpm --filter @swarm-press/site-kit schema:check
      - name: kit check on the starter fixture site
        run: node packages/site-kit/bin/kit.mjs check --root themes/starter/fixture-site
      - name: vitest (unit + astro build of the fixture site; screenshots skip without Chromium)
        run: pnpm --filter @swarm-press/site-kit test:junit
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: site-kit-vitest-junit
          path: packages/site-kit/test-results/vitest-junit.xml

  live-theme:
    name: Frozen cinque-terre theme still builds (live site guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: swarmpress/cinqueterre.travel
          path: site
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build theme like the site's deploy.yml does
        working-directory: packages/site-builder/src/themes/cinque-terre
        env:
          CONTENT_DIR: ${{ github.workspace }}/site/content/pages
        run: pnpm astro build --outDir "$GITHUB_WORKSPACE/dist"
      - run: test "$(find dist -name '*.html' | wc -l)" -ge 100

  cockpit:
    name: Cockpit (feature health gate)
    runs-on: ubuntu-latest
    needs: [rust, wasm, web, browser-runtime, sdk, site-kit]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cockpit
          key: cockpit-${{ runner.os }}-v1
      - run: command -v cockpit || cargo +1.98.0 install --git https://github.com/drietsch/cockpit --locked
      - uses: actions/download-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci
      - uses: actions/download-artifact@v4
        with:
          name: game-vitest-junit
          path: apps/game/reports
      - uses: actions/download-artifact@v4
        with:
          name: game-playwright
          path: apps/game/reports
      - uses: actions/download-artifact@v4
        with:
          # multi-path upload is rooted at apps/game (reports/ + test-results/)
          name: game-playwright-visual
          path: apps/game
      - uses: actions/download-artifact@v4
        with:
          name: bench-bundle-size
          path: artifacts/bench
      - uses: actions/download-artifact@v4
        with:
          name: orchestrator-wasm-junit
          path: crates/orchestrator-wasm/reports
      - uses: actions/download-artifact@v4
        with:
          name: game-playwright-orchestrator
          path: apps/game/reports
      - uses: actions/download-artifact@v4
        with:
          name: game-playwright-mvp
          path: apps/game/reports
      - uses: actions/download-artifact@v4
        with:
          name: sdk-junit
          path: packages/sdk/reports
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-junit
          path: packages/sandbox/reports
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-playwright
          path: packages/sandbox/reports
      - uses: actions/download-artifact@v4
        with:
          name: runner-junit
          path: packages/runner/reports
      - uses: actions/download-artifact@v4
        with:
          name: site-kit-vitest-junit
          path: packages/site-kit/test-results
      - run: cockpit scan
      - run: cockpit status
      - run: cockpit validate --strict
