name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.100

jobs:
  rust:
    name: Rust (fmt, clippy, nextest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simpress
          POSTGRES_PASSWORD: simpress
          POSTGRES_DB: simpress
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U simpress" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://simpress:simpress@localhost:5432/simpress
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml

  wasm:
    name: wasm (build, wasm-bindgen-test, size budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo xtask wasm --release
      - name: wasm-bindgen-test (node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p client-wasm --target wasm32-unknown-unknown
      - name: wasm size budget (gzip <= 400 KiB)
        run: |
          size=$(gzip -9 -c crates/client-wasm/pkg/client_wasm_bg.wasm | wc -c)
          echo "client_wasm_bg.wasm gzip: $size bytes"
          mkdir -p artifacts/bench
          cat > artifacts/bench/wasm-size.json <<JSON
          { "schema": "cockpit.benchmark.v1", "name": "wasm-size", "component": "client-wasm",
            "provenance": { "commit": "${{ github.sha }}", "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)" },
            "metrics": [ { "name": "client_wasm_bg.wasm gzip", "unit": "bytes", "value": $size,
                           "determinism": "deterministic", "direction": "lower_is_better", "budget": { "max": 409600 } } ] }
          JSON
          test "$size" -le 409600
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/client-wasm/pkg
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-wasm
          path: artifacts/bench

  web:
    name: Web (schema, typecheck, vitest, build, Playwright)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/client-wasm/pkg
      - run: pnpm schema:check
      - run: pnpm --filter @swarm-press/content-schema test
      - run: pnpm --filter @swarm-press/game typecheck
      - run: pnpm --filter @swarm-press/game exec vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml
      - name: Build client (wasm prebuilt)
        run: pnpm --filter @swarm-press/game exec vite build
      - run: pnpm --filter @swarm-press/game exec playwright install --with-deps chromium
      - run: pnpm --filter @swarm-press/game exec playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-test-results
          path: apps/game/test-results

  live-theme:
    name: Frozen cinque-terre theme still builds (live site guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: swarmpress/cinqueterre.travel
          path: site
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build theme like the site's deploy.yml does
        working-directory: packages/site-builder/src/themes/cinque-terre
        env:
          CONTENT_DIR: ${{ github.workspace }}/site/content/pages
        run: pnpm astro build --outDir "$GITHUB_WORKSPACE/dist"
      - run: test "$(find dist -name '*.html' | wc -l)" -ge 100

  cockpit:
    name: Cockpit (feature health gate)
    runs-on: ubuntu-latest
    needs: [rust, wasm, web]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cockpit
          key: cockpit-${{ runner.os }}-v1
      - run: command -v cockpit || cargo +1.98.0 install --git https://github.com/drietsch/cockpit --locked
      - uses: actions/download-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci
      - uses: actions/download-artifact@v4
        with:
          name: web-test-results
          path: apps/game/test-results
      - uses: actions/download-artifact@v4
        with:
          name: bench-wasm
          path: artifacts/bench
      - run: cockpit scan
      - run: cockpit status
      - run: cockpit validate --strict
