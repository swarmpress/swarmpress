name: visual baselines
# Renders the visual regression views (apps/game/e2e/visual.spec.ts) on the same Linux runner and
# SwiftShader WebGPU as ci.yml's Web job, with --update-snapshots, and uploads the PNGs as the
# artifact `visual-baselines`. Started by hand (Actions → visual baselines → Run workflow) after a
# deliberate change to the office's look; a person checks each image before committing it to
# apps/game/e2e/visual.spec.ts-snapshots/ (docs/guides/testing.md).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.100

jobs:
  baselines:
    name: Render the visual baselines (SwiftShader WebGPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo xtask wasm --release
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build client (wasm prebuilt)
        run: pnpm --filter @swarm-press/game exec vite build
      - run: pnpm --filter @swarm-press/game exec playwright install --with-deps chromium
      - name: Render the views with --update-snapshots
        run: pnpm --filter @swarm-press/game exec playwright test e2e/visual.spec.ts --update-snapshots
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/game/e2e/visual.spec.ts-snapshots/*.png
          if-no-files-found: error
