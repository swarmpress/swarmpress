[package]
name = "storage-api"
description = "The governed layer's storage API for the WordPress fork (ADR-0084): MySQL as WordPress sends it, translated to SQLite and run on a branch's projection, with writes classified as governed or scratch. M0 spike: the translator, the classifier and the corpus replay"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
sqlparser = { version = "0.63", features = ["visitor"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
