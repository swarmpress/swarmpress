[package]
name = "orchestrator"
description = "swarm.press orchestrator: runs sim job requests (standup, draft, review, publish) through agents, a Store and a content Gateway; wasm-compatible (no tokio, no database)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
agents = { path = "../agents" }
content-schema.workspace = true
# Closed world in-process (ADR-0061): the site's indexes for shortlists and for
# the link and media checks of the v2 validator. Both build for wasm32.
content-model = { path = "../content-model" }
knowledge = { path = "../knowledge" }
# WordPress companies (ADR-0082): article pages become Gutenberg block trees, parsed back for updates.
content-repo = { path = "../content-repo" }
# The site's models (ADR-0072, FEAT-095): the architects' edits are applied
# and checked in-process, as the server checks them.
blueprint = { path = "../blueprint" }
# The office designer's deterministic core (ADR-0087 decision 6, FEAT-084):
# the layout solver, checks and repair driver of the InteriorDesign job.
office-designer = { path = "../office-designer" }
# The web designer (ADR-0093, FEAT-115): the site's design (site-design) rendered
# as theme data, checked and repaired in-process (theme-designer).
site-design = { path = "../site-design" }
theme-designer = { path = "../theme-designer" }
site-quality = { path = "../site-quality" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Native only: the adapter over the GitHub client (reqwest/tokio are not wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
github = { path = "../github" }
# The `swarmpress-site-theme` CLI (feature `cli`): the web designer's job on a design,
# with the fake or GPT-6-Luna through the central server, outside the game.
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
content-import-wp = { path = "../content-import-wp", optional = true }
claude = { path = "../claude", default-features = false, optional = true }

[features]
cli = ["dep:tokio", "dep:reqwest", "dep:content-import-wp", "dep:claude"]

[[bin]]
name = "swarmpress-site-theme"
path = "src/bin/swarmpress-site-theme.rs"
required-features = ["cli"]

# jsonschema (via content-schema and claude) pulls ahash -> getrandom 0.3, which
# needs its JS backend on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# tests/timeout.rs: a failed job's outcome applied to the real sim (ticket, Retry).
sim-core.workspace = true
jsonschema = { version = "0.33", default-features = false }

[lints]
workspace = true
