[package]
name = "kit-wasm"
description = "wasm-bindgen facade over the construction kit compiler (crates/kit) for the renderer; a separate module with its own size budget"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kit = { path = "../kit" }
serde.workspace = true
serde_json.workspace = true
# Must match the wasm-bindgen CLI version used by `cargo xtask wasm`.
wasm-bindgen = "=0.2.100"

[dev-dependencies]
# 0.3.50 is the release paired with wasm-bindgen 0.2.100.
wasm-bindgen-test = "=0.3.50"

[lints]
workspace = true
