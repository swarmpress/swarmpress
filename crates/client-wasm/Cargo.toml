[package]
name = "client-wasm"
description = "wasm-bindgen facade over sim-core and protocol for the browser client"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
# Must match the wasm-bindgen CLI version used by `cargo xtask wasm`.
wasm-bindgen = "=0.2.100"

[dev-dependencies]
# 0.3.50 is the release paired with wasm-bindgen 0.2.100 (and with the
# wasm-bindgen-test-runner shipped in wasm-bindgen-cli 0.2.100).
wasm-bindgen-test = "=0.3.50"

[lints]
workspace = true
