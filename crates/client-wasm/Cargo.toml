[package]
name = "client-wasm"
description = "wasm-bindgen facade over sim-core and protocol for the browser client"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core.workspace = true
protocol.workspace = true
# Must match the wasm-bindgen CLI version used by `cargo xtask wasm`.
wasm-bindgen = "=0.2.100"

[lints]
workspace = true
