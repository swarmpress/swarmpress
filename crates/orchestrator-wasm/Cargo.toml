[package]
name = "orchestrator-wasm"
description = "wasm-bindgen bridge over the orchestrator: Store, Gateway and Llm implemented by JS objects (browser and Bun); a separate module so the sim bundle keeps its size budget"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The bridge is wasm32-only: JS values are not `Send`, and the orchestrator's
# traits are `?Send` only on wasm32. On native targets the crate is empty, so
# the workspace still builds, lints and tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
orchestrator = { path = "../orchestrator" }
# A WordPress site's knowledge pack and block set (ADR-0082).
knowledge = { path = "../knowledge" }
# The static export of a WordPress site's live branch (ADR-0083), crawled through the sandbox.
site-export = { path = "../site-export" }
agents = { path = "../agents" }
# A site's design and its theme as data (ADR-0093): the REST calls a WordPress engine runs.
site-design = { path = "../site-design" }
content-import-wp = { path = "../content-import-wp" }
claude = { path = "../claude", default-features = false }
serde_json.workspace = true
async-trait = "0.1"
# Pinned to the releases paired with wasm-bindgen 0.2.100 (the CLI pin).
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"

[lints]
workspace = true
