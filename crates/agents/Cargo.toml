[package]
name = "agents"
description = "swarm.press agent layer: roles, personas, prompt layering, state machines, executors, meetings and the editorial pipeline (orchestrator-owned; LLMs return artifacts)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Types, `ClaudeApi` and structured-output helpers only; no HTTP transport,
# so agents (and the orchestrator) build for wasm32-unknown-unknown.
claude = { path = "../claude", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait = "0.1"
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
insta = { version = "1", features = ["json"] }
# Tests only: the assembled article is validated against the v2 page schema.
content-model = { path = "../content-model" }

[lints]
workspace = true
