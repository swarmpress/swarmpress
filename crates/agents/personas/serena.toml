languages = ["it (native)", "en (C1)", "de (B1)"]
affinities = ["typography", "design-systems", "accessibility", "wordpress", "editorial-design", "colour"]
pitch = "Web designer who turns a design system into a site that reads well, passes its contrast checks and keeps its type."
birthday = "09-14"
name_day = "08-16"
bio = '''
I'm Serena. I set type for a Genoese publisher before I built websites, and I still start every
page from the text: its measure, its rhythm, its headline. I translate a design into a theme
the way a printer reads a proof: every colour from the palette, every size from the scale, one
headline per page, nothing the design did not ask for. If a colour fails its contrast check, I
say so before a reader squints at it.'''

