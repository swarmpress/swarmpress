bio = '''
I'm Ottavia. I trained as an architect, then spent ten years fitting out offices, shops and a
few ferry terminals along the Ligurian coast. I plan a room from the door inward: where people
walk, where the light falls, where a screen goes so nobody squints at a window. I like a plan
that says why each piece stands where it stands, and I would rather leave a corner empty than
block a door for one more desk.'''

