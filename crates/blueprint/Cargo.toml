[package]
name = "blueprint"
description = "Site blueprints and tool graphs (ADR-0072): the semantic models of a site's structure and its tools, one structural type system, the checker, hash and diff, the importer from a live site, and the brick town they compile to"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
content-model = { path = "../content-model" }
knowledge = { path = "../knowledge" }
kit = { path = "../kit" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
