[package]
name = "content-import-wp"
description = "A JSON-block site moved onto WordPress (ADR-0083 §5): its routes, its pages as core blocks, the import plan the sandbox's REST API runs, and the URL-by-URL comparison of the export with the live site"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"], optional = true }
sha2 = { version = "0.10", optional = true }
site-export = { path = "../site-export" }
# The theme as data (ADR-0093): its types and shape rules are the site design's (FEAT-114).
site-design = { path = "../site-design" }

[features]
# The migration CLI (`swarmpress-wp-migrate`): applies a plan over HTTP, exports, compares.
cli = ["dep:anyhow", "dep:tokio", "dep:reqwest", "dep:sha2"]

[[bin]]
name = "swarmpress-wp-migrate"
path = "src/bin/swarmpress-wp-migrate.rs"
required-features = ["cli"]

[lints]
workspace = true
