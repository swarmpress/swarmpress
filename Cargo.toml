[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/swarmpress/swarmpress"
rust-version = "1.85"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
protocol = { path = "crates/protocol" }
content-schema = { path = "crates/content-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"
anyhow = "1"

[workspace.lints.clippy]
float_arithmetic = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
