# The GPL sandbox swarm.press runs WordPress in (ADR-0078, ADR-0079, ADR-0084): php-wasm, the
# WordPress fork and pinned plugins, built and released by swarmpress/wp-sandbox. swarm.press never
# links it: `cargo xtask sandbox-fetch` downloads this release into vendor/wp-sandbox/ (git-ignored),
# checks it against `sha256`, and the game embeds its browser entry from its own origin; the
# runner and conformance start its Node entry as a separate process.
#
# A new sandbox release changes every field below in one commit.
