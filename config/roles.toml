# ---------------------------------------------------------------------------
# Job executors (plan D, ADR-0024). Tiers: low < mid < high.
# Browser: chatter, triage, briefings, drafts. Claude: business cases, site
# changes, research with web search, candidate generation, theme work.
# ---------------------------------------------------------------------------

# --- Editorial pipeline and meetings ----------------------------------------

[jobs.standup]
executor = "browser"
min_tier = "low"
role = "editor-in-chief"
also = ["editor"]
max_tokens = 1024

[jobs.brief]
executor = "browser_then_claude"
min_tier = "mid"
role = "editor-in-chief"
also = ["editor"]
max_tokens = 2048

[jobs.draft]
