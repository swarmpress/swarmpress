# SimPress roles and job executors.
#
# Loaded by `agents::RolesConfig` (embedded at build time via include_str!,
# overridable at runtime with RolesConfig::from_toml_str).
#
# Role and job names are kebab-case, matching the sim's `Role` and the wire
# JSON (docs/game-design/organization.md §2, §9).
#
# [roles.*]   Claude (Agency) model + effort per role (plan, Subsystems 3).
#             Applies to Claude-executed jobs. Staff jobs run on the local
#             browser model tier (plan D); see config/models.toml. Every staff
#             role needs a profile.
# [seniority] Staff seniority overrides the role's Claude model (plan A):
#             Junior -> haiku, Mid -> sonnet, Senior/Star -> opus.
# [jobs.*]    Executor policy per JobKind (ADR-0024): browser | claude |
#             browser_then_claude, the minimum device tier for browser
#             execution, the role whose prompt/profile runs the job, `also`
#             (other roles that may perform it when the project team has nobody
#             in `role`), and the output token budget.
#
# Effort is always sent explicitly (output_config.effort); valid values:
# low | medium | high | xhigh | max. Thinking is adaptive on these models and
# is never configured here.

# --- Executive Office -------------------------------------------------------

[roles.cfo]
model = "claude-sonnet-5-5"
effort = "medium"

[roles.secretary]
model = "claude-sonnet-5-5"
effort = "low"

# --- Strategy ---------------------------------------------------------------

[roles.strategist]
