# Tests that cannot be linked by path (Rust unit tests in a crate's lib.rs resolve to the crate's
# src/ directory) are mapped explicitly here. Path ownership covers everything else.
[test_map]
files = ["docs/test-map.yaml"]

[health]
max_evidence_age = "14d"
required_evidence = { critical = ["test"], high = ["test"], normal = [], low = [] }

[performance]
baseline = "previous-comparable"
[[performance.metrics]]
match = "*/*/wasm.bytes"
determinism = "deterministic"
direction = "lower_is_better"
budget = { max = 3145728 }
[[performance.metrics]]
match = "*/*/claude.calls"
determinism = "deterministic"
direction = "lower_is_better"
[[performance.metrics]]
match = "*/*/frame.p95_ms"
determinism = "environment-sensitive"
direction = "lower_is_better"
budget = { max = 33.3 }

[policy.references]
fail_on_broken_reference = true
