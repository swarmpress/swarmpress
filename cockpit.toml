# Cockpit (https://github.com/drietsch/cockpit) derives per-feature health for SimPress from
# docs/features/**, docs/adr/**, the test and benchmark reports below, and git history.
# Missing evidence is Unknown, never green. See docs/guides/testing.md and ADR-0022.
#
#   cockpit scan && cockpit status        # local overview
#   cockpit validate --strict             # the CI gate (runs after the test jobs)
#   cockpit pull                          # fetch the newest CI artifacts from GitHub Actions
#   cockpit serve --watch                 # dashboard on http://127.0.0.1:4747

[project]
id = "simpress"
name = "SimPress"
primary_branch = "main"

[features]
path = "docs/features"
id_pattern = "^FEAT-\\d{3}$"
default_importance = "normal"
default_lifecycle = "planned"

[adrs]
path = "docs/adr"
exclude = ["README.md"]

[git]
# Commits that touch only these never make evidence stale.
implementation_paths_exclude = ["docs/**", "**/*.md", "cockpit.toml", "assets/out/**"]

# ---------------------------------------------------------------- Rust (cargo nextest)
# `cargo nextest run --workspace --profile ci` → target/nextest/ci/junit.xml (.config/nextest.toml).
# One report for the workspace, split per crate into components.
[[evidence]]
id = "simpress/nextest"
title = "cargo nextest (workspace)"
format = "junit"
kind = "unit"
path = [".cockpit/evidence/simpress__nextest/**/*.xml", "target/nextest/ci/junit.xml"]
component = "sim"
[evidence.github]
repo = "swarmpress/swarmpress"
workflow = "ci.yml"
artifact = "nextest-junit"
branch = "main"
[[evidence.split]]
packages = ["server"]
id = "server/nextest"
component = "server"
[[evidence.split]]
packages = ["agents", "orchestrator"]
id = "agents/nextest"
component = "agents"
[[evidence.split]]
packages = ["claude"]
id = "claude/nextest"
component = "agents"
[[evidence.split]]
packages = ["github"]
id = "github/nextest"
component = "ops"
[[evidence.split]]
packages = ["knowledge"]
id = "knowledge/nextest"
component = "content"
[[evidence.split]]
packages = ["content-schema", "content-model"]
id = "content/nextest"
component = "content"
[[evidence.split]]
packages = ["protocol", "client-wasm"]
id = "net/nextest"
component = "net"

# Split targets: the workspace report above routes these crates' cases here. Their own paths
# only hold artifacts pulled under their id (none today: CI uploads one workspace report).
[[evidence]]
id = "server/nextest"
